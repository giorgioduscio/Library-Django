{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Elimina Utente</h1>
    <p>Sei sicuro di voler eliminare l'utente <strong>{{ utente.nome }} {{ utente.cognome }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Conferma Eliminazione</button>
        <a href="{% url 'utente_list' %}" class="btn btn-secondary">Annulla</a>
    </form>
</div>
{% endblock %}
