{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Dettagli Utente</h1>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">{{ utente.nome }} {{ utente.cognome }}</h5>
            <p class="card-text"><strong>Email:</strong> {{ utente.email }}</p>
            <p class="card-text"><strong>Età:</strong> {{ utente.eta }}</p>
            <p class="card-text"><strong>Attivo:</strong> {{ utente.attivo|yesno:"Sì,No" }}</p>
            
            <a href="{% url 'utente_update' utente.pk %}" class="btn btn-warning">Modifica</a>
            <a href="{% url 'utente_delete' utente.pk %}" class="btn btn-danger">Elimina</a>
            <a href="{% url 'utente_list' %}" class="btn btn-secondary">Torna alla lista</a>
        </div>
    </div>
</div>
{% endblock %}
