<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Demo{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
    </style>
  </head>
  <body style="min-height: 100vh; background: linear-gradient(0deg, #333, #000);">
    <div id="app" class="pt-4 text-white">

      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
          <a class="navbar-brand" href="{% url 'home' %}">Library Demo</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExampleDefault" aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarsExampleDefault">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'risorsa_all' %}">Catalogo</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'user_list' %}">Utenti</a>
              </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              {% if user.is_authenticated %}
                <!-- autenticato -->
                <li class="nav-item">
                  <a class="nav-link text-info" href="{% url 'user_detail' user.id %}">{{ user.username }}</a>
                </li>
                <li class="nav-item">
                  <form action="{% url 'auth_logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="nav-link btn btn-link text-white" style="text-decoration: none;">Esci</button>
                  </form>
                </li>

              {% else %}
                <!-- non autenticato -->
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'auth_access' %}">Accedi</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'auth_register' %}">Registrati</a>
                </li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>

      <!-- CONTENT -->
      <main class="container mt-5">
          {% block content %}
          {% endblock %}
      </main>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
