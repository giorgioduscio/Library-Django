{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Elenco Utenti</h1>
    <a href="{% url 'utente_create' %}" class="btn btn-primary mb-3">Nuovo Utente</a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Email</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            {% for utente in utenti %}
            <tr>
                <td>{{ utente.id }}</td>
                <td>{{ utente.nome }}</td>
                <td>{{ utente.cognome }}</td>
                <td>{{ utente.email }}</td>
                <td>
                    <a href="{% url 'utente_detail' utente.pk %}" class="btn btn-sm btn-info">Dettagli</a>
                    <a href="{% url 'utente_update' utente.pk %}" class="btn btn-sm btn-warning">Modifica</a>
                    <a href="{% url 'utente_delete' utente.pk %}" class="btn btn-sm btn-danger">Elimina</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Nessun utente trovato.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
