    function analizzaParola(stringa='') {
      if (typeof(stringa) !== 'string' || !stringa) {
        console.error(stringa, "errore: il parametro deve essere una stringa");
      }

      const capovolta = stringa.split('').reverse().join('').replaceAll(' ', '');
      const senzaSpazi = stringa.replaceAll(' ', '');
      const e_palindroma = senzaSpazi.toLowerCase() 
                 === capovolta.toLowerCase();
      return {
        lunghezza: stringa.length,
        maiuscola: stringa.toUpperCase(),
        minuscola: stringa.toLowerCase(),
        e_palindroma: e_palindroma,
      }
    }

    const studenti = [
      { nome: 'Alice', voti: [85, 92, 78, 88] },

      { nome: 'Carol', voti: [95, 98, 92, 97] },

    const studenti_medie = studenti.map(studente=>{

    });
    const classifica = studenti_medie.filter(s=> s.media >= 60)
